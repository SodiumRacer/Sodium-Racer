<title>Sodium Racer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Sodium: a nostalgic night highway racing game with CPU rivals, online rooms, a garage and a track maker.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<style>/* Layout: one full-bleed WebGL canvas; menus sit in a left column over the live night drive; HUD hugs the corners. */
:root {
  --ink: #0a0b0d;
  --panel: rgba(9, 10, 12, 0.86);
  --panel-solid: #111215;
  --line: rgba(236, 230, 218, 0.14);
  --line-strong: rgba(236, 230, 218, 0.32);
  --text: #ece6da;
  --muted: #a39d92;
  --dim: #6f6a62;
  --amber: #ffb35a;
  --amber-deep: #d06d18;
  --red: #ff5b3a;
  --sky: #7fc4ff;
  --display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --body: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --top: env(safe-area-inset-top, 0px);
  --bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--text); }
body { font-family: var(--body); font-size: 15px; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; overscroll-behavior: none; }
#gl, .touch, .tc-steer, .tc-btn, .ed-canvas, .hue, .shade { touch-action: none; }
.menu-col, .scroll, .results, .gbody, .rwrap { touch-action: pan-x pan-y; }
input, button { font: inherit; color: inherit; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; }
#fade { position: fixed; inset: 0; background: #000; opacity: 1; pointer-events: none; transition: opacity 0.45s ease; z-index: 50; }
#fade.clear { opacity: 0; }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
.screen { position: absolute; inset: 0; pointer-events: auto; padding: calc(var(--top) + 22px) var(--gutter-r) calc(var(--bottom) + 18px) var(--gutter-l); display: flex; flex-direction: column; box-sizing: border-box; }
.screen[hidden] { display: none !important; }
.scrim { background: linear-gradient(90deg, rgba(5, 6, 8, 0.9) 0%, rgba(5, 6, 8, 0.72) 34%, rgba(5, 6, 8, 0.0) 68%); }
.scrim-full { background: rgba(5, 6, 8, 0.74); }

/* ---------- type ---------- */
.eyebrow { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
.h1 { font-family: var(--display); font-weight: 700; font-style: italic; font-size: clamp(34px, 5vw, 54px); line-height: 0.95; letter-spacing: 0.01em; text-transform: uppercase; margin: 6px 0 0; text-wrap: balance; }
.lead { color: var(--muted); max-width: 46ch; line-height: 1.45; margin: 10px 0 0; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- top bar with clock (XMB nod) ---------- */
.topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.clock { font-family: var(--display); font-weight: 500; font-size: 17px; letter-spacing: 0.04em; color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; background: rgba(9, 10, 12, 0.62); padding: 3px 8px; }

/* ---------- title ---------- */
.title-wrap { margin: auto 0; display: flex; flex-direction: column; gap: 14px; max-width: 640px; }
.logo { font-family: var(--display); font-weight: 700; font-size: clamp(64px, 14vw, 148px); letter-spacing: 0.16em; line-height: 0.86; margin: 0; color: var(--text); }
.logo-rule { width: min(420px, 70%); height: 3px; background: var(--amber); }
.tagline { font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: 0.34em; text-transform: uppercase; color: var(--muted); }
.press { margin-top: 26px; font-family: var(--display); font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; font-size: 16px; color: var(--amber); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .press { animation: none; } }

/* ---------- menu lists ---------- */
.menu-col { display: flex; flex-direction: column; gap: 18px; margin-top: auto; margin-bottom: auto; max-width: 560px; min-width: 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.list { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 0; padding: 0; }
.item { position: relative; display: flex; align-items: center; gap: 14px; min-height: 46px; padding: 0 12px 0 18px; border: 0; background: none; text-align: left; cursor: pointer; font-family: var(--display); font-weight: 600; font-style: italic; font-size: clamp(24px, 3.4vw, 34px); letter-spacing: 0.02em; text-transform: uppercase; color: var(--text); transition: transform 0.12s ease, color 0.12s ease; }
.item::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; background: var(--amber); transform: scaleY(0); transition: transform 0.12s ease; }
.item.sel { color: var(--amber); transform: translateX(8px); }
.item.sel::before { transform: scaleY(1); }
.item:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.item.small { font-size: 22px; min-height: 40px; }
.item.disabled { color: var(--dim); }
.desc { min-height: 2.9em; color: var(--muted); max-width: 44ch; line-height: 1.45; margin: 6px 0 0 18px; }

/* Rows with a value: label left, value right with arrows. */
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 44px; padding: 0 10px 0 18px; cursor: pointer; position: relative; border-bottom: 1px solid var(--line); }
.row::before { content: ''; position: absolute; left: 0; top: 9px; bottom: 9px; width: 4px; background: var(--amber); transform: scaleY(0); transition: transform 0.12s ease; }
.row.sel::before { transform: scaleY(1); }
.row .lab { font-family: var(--display); font-weight: 600; font-size: 19px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.sel .lab { color: var(--text); }
.row .val { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: 0.03em; text-transform: uppercase; white-space: nowrap; }
.row .val .v { min-width: 7.5em; text-align: center; font-variant-numeric: tabular-nums; }
.arrow { width: 34px; height: 34px; display: grid; place-items: center; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; }
.row.sel .arrow { color: var(--amber); }
.arrow svg { width: 14px; height: 14px; }
.row .bar { width: 160px; height: 6px; background: rgba(236, 230, 218, 0.14); position: relative; }
.row .bar i { position: absolute; inset: 0 auto 0 0; background: var(--amber); }
.row.button-row .lab { color: var(--text); font-style: italic; font-size: 22px; }
.row.button-row.sel .lab { color: var(--amber); }
.row input[type=text] { width: 12em; max-width: 46vw; background: rgba(236, 230, 218, 0.06); border: 1px solid var(--line-strong); padding: 7px 10px; font-family: var(--display); font-size: 19px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text); border-radius: 0; user-select: text; -webkit-user-select: text; }
.row input[type=text]:focus { outline: 2px solid var(--amber); outline-offset: 0; }

/* ---------- footer hints ---------- */
.hints { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; font-family: var(--display); font-weight: 500; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 16px; }
.hints kbd { display: inline-grid; place-items: center; min-width: 24px; height: 22px; padding: 0 6px; margin-right: 7px; border: 1px solid var(--line-strong); font-family: var(--display); font-size: 13px; color: var(--text); box-sizing: border-box; }
.touch-device .hints { display: none; }
.back-btn { align-self: flex-start; border: 1px solid var(--line-strong); background: rgba(9, 10, 12, 0.6); color: var(--text); font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; padding: 8px 14px; cursor: pointer; }
.back-btn:hover, .back-btn:focus-visible { color: var(--amber); border-color: var(--amber); outline: none; }

/* ---------- two-column layouts ---------- */
.split { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: 28px; flex: 1; min-height: 0; margin-top: 18px; }
.split > .menu-col { max-height: 100%; }
.split > * { min-width: 0; }
.panel { background: var(--panel); border-left: 1px solid var(--line); padding: 16px 18px; }
.card-note { color: var(--muted); line-height: 1.45; font-size: 14px; }
.scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
.scroll::-webkit-scrollbar { width: 6px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line-strong); }

/* ---------- track preview ---------- */
.preview { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.preview canvas { width: min(320px, 100%); height: auto; aspect-ratio: 1 / 1; max-width: 100%; }
.preview .facts { display: grid; grid-template-columns: auto auto; gap: 4px 18px; font-family: var(--display); font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; }
.preview .facts span:nth-child(odd) { color: var(--muted); }

/* ---------- garage ---------- */
.garage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 420px); gap: 20px; flex: 1; min-height: 0; margin-top: 14px; }
.garage .info { align-self: end; display: flex; flex-direction: column; gap: 10px; max-width: 420px; }
.garage .carname { font-family: var(--display); font-weight: 700; font-style: italic; font-size: clamp(34px, 5vw, 52px); text-transform: uppercase; line-height: 0.95; }
.garage .carkind { font-family: var(--display); font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--amber); font-size: 14px; }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; align-items: center; font-family: var(--display); font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.stats .meter { height: 5px; background: rgba(236, 230, 218, 0.14); position: relative; }
.stats .meter i { position: absolute; inset: 0 auto 0 0; background: var(--text); }
.gpanel { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { flex: 1 0 auto; border: 0; background: none; padding: 13px 10px 11px; font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; }
.tab.on { color: var(--text); border-bottom-color: var(--amber); }
.gbody { padding: 6px 4px 10px; }
.swatches { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; padding: 10px 14px 12px 18px; }
.sw { aspect-ratio: 1 / 1; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(236, 230, 218, 0.18); cursor: pointer; padding: 0; box-sizing: border-box; }
.sw.on { border-color: var(--amber); outline: 2px solid var(--ink); outline-offset: -4px; }
.swrow { position: relative; border-bottom: 1px solid var(--line); }
.swrow::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; background: var(--amber); transform: scaleY(0); transition: transform 0.12s ease; }
.swrow.sel::before { transform: scaleY(1); }
.swrow.sel .swatch-label { color: var(--text); }
.swatch-label { padding: 8px 18px 0; font-family: var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-size: 14px; }
.hue { margin: 4px 14px 12px 18px; height: 22px; position: relative; cursor: pointer; background: linear-gradient(90deg, #f33, #fb3, #ef3, #3e5, #3ce, #36f, #b3f, #f3a, #f33); touch-action: none; }
.hue .knob { position: absolute; top: -4px; bottom: -4px; width: 6px; margin-left: -3px; background: var(--text); box-shadow: 0 0 0 2px var(--ink); }
.shade { margin: 0 14px 10px 18px; height: 22px; position: relative; cursor: pointer; touch-action: none; }
.shade .knob { position: absolute; top: -4px; bottom: -4px; width: 6px; margin-left: -3px; background: var(--text); box-shadow: 0 0 0 2px var(--ink); }
.gfoot { margin-top: auto; padding: 12px 14px; border-top: 1px solid var(--line); display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line-strong); background: rgba(236, 230, 218, 0.04); color: var(--text); font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: 0.12em; text-transform: uppercase; padding: 10px 16px; cursor: pointer; }
.btn.primary { background: var(--amber); color: #1a1007; border-color: var(--amber); }
.btn:hover, .btn:focus-visible { border-color: var(--amber); outline: none; }
.btn.primary:hover, .btn.primary:focus-visible { background: #ffc47d; }

/* ---------- results ---------- */
.results { margin: auto 0; width: min(760px, 100%); background: var(--panel); border-left: 3px solid var(--amber); padding: 20px 22px 18px; box-sizing: border-box; max-height: 100%; min-height: 0; overflow-y: auto; }
.rtable { width: 100%; border-collapse: collapse; margin-top: 14px; font-family: var(--display); font-size: 19px; letter-spacing: 0.04em; text-transform: uppercase; }
.rtable th { text-align: left; font-weight: 600; font-size: 13px; letter-spacing: 0.18em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line-strong); }
.rtable td { padding: 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rtable tr.me td { color: var(--amber); }
.rtable td.pos { font-weight: 700; font-style: italic; width: 2.4em; }
.rtable .proj { color: var(--dim); }
.rwrap { overflow-x: auto; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(var(--bottom) + 26px); transform: translateX(-50%); background: var(--panel-solid); border-left: 3px solid var(--amber); padding: 10px 16px; font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; z-index: 60; pointer-events: none; max-width: calc(100vw - 40px); }
.toast[hidden] { display: none; }

/* ---------- online ---------- */
.code-big { font-family: var(--display); font-weight: 700; font-size: clamp(56px, 10vw, 96px); letter-spacing: 0.22em; line-height: 1; color: var(--amber); user-select: text; -webkit-user-select: text; }
.players { display: flex; flex-direction: column; margin-top: 10px; }
.player-row { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--line); font-family: var(--display); font-size: 19px; letter-spacing: 0.04em; text-transform: uppercase; }
.player-row .dot { width: 12px; height: 12px; }
.player-row .meta { color: var(--muted); font-size: 15px; }
.status-line { font-family: var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-size: 15px; margin-top: 8px; min-height: 1.3em; }
.status-line.err { color: var(--red); }
.open-races { margin-top: 12px; }
.open-races .row .lab { color: var(--text); }

/* ---------- HUD ---------- */
.hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; font-family: var(--display); }
.hud[hidden] { display: none; }
.hud .lbl { font-weight: 600; font-size: 13px; letter-spacing: 0.2em; color: var(--muted); margin-right: 10px; }
.hud-tl { position: absolute; top: calc(var(--top) + 16px); left: var(--gutter-l); display: flex; flex-direction: column; gap: 4px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7); }
.hud-pos { line-height: 0.85; }
.hud-pos-n { font-weight: 700; font-style: italic; font-size: 76px; }
.hud-pos-of { font-weight: 600; font-style: italic; font-size: 30px; color: var(--muted); margin-left: 4px; }
.hud-lap { font-weight: 600; font-size: 26px; font-style: italic; }
.hud-times { display: flex; flex-direction: column; gap: 1px; font-size: 20px; font-weight: 500; }
.hud-map { position: absolute; top: calc(var(--top) + 12px); right: var(--gutter-r); width: 150px; height: 150px; opacity: 0.95; }
.hud-br { position: absolute; right: var(--gutter-r); bottom: calc(var(--bottom) + 10px); width: 260px; height: 150px; }
.hud-tach { position: absolute; inset: 0; width: 260px; height: 150px; }
.hud-speed { position: absolute; right: 16px; bottom: 32px; text-align: right; line-height: 0.9; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7); }
.hud-speed .num { font-weight: 700; font-style: italic; font-size: 58px; }
.hud-unit { display: block; font-weight: 600; font-size: 13px; letter-spacing: 0.22em; color: var(--muted); }
.hud-gear { position: absolute; right: 20px; bottom: 6px; font-size: 20px; font-weight: 700; font-style: italic; }
.hud-center { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font-weight: 700; font-style: italic; font-size: clamp(54px, 9vw, 110px); letter-spacing: 0.04em; opacity: 0; transform: scale(1.06); transition: opacity 0.18s ease, transform 0.18s ease; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6); }
.hud-center.show { opacity: 1; transform: none; }
.hud-center.warn { color: var(--red); font-size: clamp(40px, 7vw, 76px); }
.hud-center.go { color: var(--amber); }
.hud-sub { position: absolute; left: 0; right: 0; top: calc(34% + clamp(64px, 10vw, 120px)); text-align: center; font-weight: 600; font-size: 18px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text); opacity: 0; transition: opacity 0.18s ease; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); }
.hud-sub.show { opacity: 1; }
.hud-drift { position: absolute; left: 50%; bottom: calc(var(--bottom) + 36px); transform: translateX(-50%); width: 220px; opacity: 0; transition: opacity 0.2s ease; text-align: center; }
.hud-drift.show { opacity: 1; }
.hud-drift-bar { height: 4px; background: var(--text); transform-origin: left center; transform: scaleX(0); margin-bottom: 6px; }
.hud-drift.boost .hud-drift-bar { background: var(--amber); }
.hud-drift span { font-weight: 700; font-style: italic; font-size: 18px; letter-spacing: 0.2em; }
.hud-board { position: absolute; left: var(--gutter-l); top: calc(var(--top) + 210px); display: flex; flex-direction: column; gap: 1px; font-size: 15px; letter-spacing: 0.06em; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8); }
.hud-board .row { display: grid; grid-template-columns: 1.6em 5.6em 3.6em; gap: 6px; min-height: 0; padding: 0; border: 0; cursor: default; }
.hud-board .row::before { display: none; }
.hud-board .row .p { font-weight: 700; font-style: italic; }
.hud-board .row .g { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.hud-board .row.me { color: var(--amber); }

/* ---------- touch controls ---------- */
.touch { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
.touch[hidden] { display: none; }
.tc-steer { position: absolute; left: 0; bottom: 0; width: 46%; height: 62%; pointer-events: auto; touch-action: none; }
.tc-knob { position: absolute; bottom: calc(var(--bottom) + 46px); left: calc(var(--gutter-l) + 70px); width: 92px; height: 92px; margin-left: -46px; border: 2px solid rgba(236, 230, 218, 0.4); border-radius: 50%; background: rgba(9, 10, 12, 0.3); transition: opacity 0.15s ease; opacity: 0.55; }
.tc-knob::after { content: ''; position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px; border-radius: 50%; background: rgba(236, 230, 218, 0.75); }
.tc-knob.on { opacity: 1; }
.tc-pedals { position: absolute; right: var(--gutter-r); bottom: calc(var(--bottom) + 22px); display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; gap: 12px; pointer-events: auto; align-items: end; }
.tc-btn { border: 2px solid rgba(236, 230, 218, 0.45); background: rgba(9, 10, 12, 0.42); color: var(--text); font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.14em; touch-action: none; display: grid; place-items: center; cursor: pointer; }
.tc-btn.on { background: rgba(255, 179, 90, 0.35); border-color: var(--amber); }
.tc-gas { width: 96px; height: 120px; grid-column: 2; grid-row: 1 / span 2; }
.tc-brake { width: 82px; height: 62px; grid-column: 1; grid-row: 2; }
.tc-drift { width: 82px; height: 50px; grid-column: 1; grid-row: 1; }
.autogas .tc-gas { display: none; }
.autogas .tc-pedals { grid-template-columns: auto; }

/* ---------- editor ---------- */
.editor { padding: 0; }
.ed-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; background: #0c0d10; }
.ed-top { position: absolute; top: calc(var(--top) + 12px); left: var(--gutter-l); right: var(--gutter-r); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; pointer-events: auto; }
.ed-name { background: rgba(9, 10, 12, 0.8); border: 1px solid var(--line-strong); padding: 8px 10px; font-family: var(--display); font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text); width: 14em; max-width: 52vw; user-select: text; -webkit-user-select: text; }
.ed-tools { position: absolute; left: var(--gutter-l); bottom: calc(var(--bottom) + 14px); right: var(--gutter-r); display: flex; gap: 8px; flex-wrap: wrap; pointer-events: auto; align-items: flex-end; }
.tool { border: 1px solid var(--line-strong); background: rgba(9, 10, 12, 0.82); color: var(--text); font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; padding: 10px 13px; cursor: pointer; min-height: 44px; }
.tool.on { border-color: var(--amber); color: var(--amber); }
.tool.go { background: var(--amber); color: #1a1007; border-color: var(--amber); }
.tool:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
.ed-info { position: absolute; right: var(--gutter-r); top: calc(var(--top) + 64px); background: rgba(9, 10, 12, 0.82); border-left: 1px solid var(--line); padding: 10px 14px; font-family: var(--display); font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; display: grid; grid-template-columns: auto auto; gap: 4px 14px; pointer-events: none; }
.ed-info span:nth-child(odd) { color: var(--muted); }
.ed-help { position: absolute; left: var(--gutter-l); top: calc(var(--top) + 66px); max-width: 34ch; color: var(--muted); font-size: 14px; line-height: 1.45; pointer-events: none; background: rgba(9, 10, 12, 0.7); padding: 8px 12px; }
.ed-height { position: absolute; right: var(--gutter-r); bottom: calc(var(--bottom) + 76px); display: flex; flex-direction: column; gap: 6px; pointer-events: auto; background: rgba(9, 10, 12, 0.86); padding: 10px; border-left: 1px solid var(--line); }
.ed-height[hidden] { display: none; }
.ed-height .lab { font-family: var(--display); font-size: 13px; letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase; }
.modal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5, 6, 8, 0.7); pointer-events: auto; padding: 20px; z-index: 30; }
.modal[hidden] { display: none; }
.modal .box { background: var(--panel-solid); border-left: 3px solid var(--amber); padding: 18px 20px; width: min(560px, 100%); box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; }
.modal textarea { width: 100%; min-height: 110px; box-sizing: border-box; background: rgba(236, 230, 218, 0.05); border: 1px solid var(--line-strong); color: var(--text); font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 12px; padding: 10px; resize: vertical; user-select: text; -webkit-user-select: text; word-break: break-all; }

/* ---------- small screens ---------- */
@media (max-width: 820px) {
  .split, .garage { grid-template-columns: minmax(0, 1fr); }
  .preview { display: none; }
  .garage .info { align-self: start; }
  .garage .gpanel { max-height: 52vh; }
  .scrim { background: linear-gradient(180deg, rgba(5, 6, 8, 0.86) 0%, rgba(5, 6, 8, 0.6) 60%, rgba(5, 6, 8, 0.4) 100%); }
  .hud-pos-n { font-size: 56px; }
  .hud-map { width: 112px; height: 112px; }
  .hud-board { display: none; }
  .hud-br { transform: scale(0.8); transform-origin: right bottom; }
  .touch-device .hud-br { bottom: auto; top: calc(var(--top) + 130px); transform: scale(0.62); transform-origin: right top; }
    .touch-device   .row .val .v { min-width: 5.5em; }
  .row .bar { width: 110px; }
}
@media (max-height: 520px) {
  .screen { padding-top: calc(var(--top) + 10px); padding-bottom: calc(var(--bottom) + 8px); }
  .hints { display: none; }
  .hud-pos-n { font-size: 46px; }
  .hud-lap { font-size: 20px; }
  .hud-times { font-size: 16px; }
  .hud-board { display: none; }
  .hud-map { width: 104px; height: 104px; }
  .item { min-height: 36px; font-size: 23px; }
  .menu-col { gap: 8px; }
  .desc { min-height: 0; }
  .h1 { font-size: 30px; }
  .split { margin-top: 8px; }
  .row { min-height: 38px; }
  .results { padding: 12px 16px; }
  .rtable { font-size: 16px; margin-top: 8px; }
  .rtable td { padding: 5px 8px; }
  .code-big { font-size: 52px; }
  .garage .carname { font-size: 30px; }
  .garage .gpanel { max-height: calc(100vh - 90px); }
  .stats { display: none; }
  .preview canvas { width: min(190px, 100%); }
  .preview .facts { font-size: 14px; }
}
/* Phones: the speedo moves up beside the map so thumbs never cover it. */
.touch-device .hud-br { bottom: auto; top: calc(var(--top) + 118px); transform: scale(0.62); transform-origin: right top; }
.touch-device .hud-drift { bottom: calc(var(--bottom) + 180px); }
.touch-device .hud-board { display: none; }
.touch-device .hud-pause-fixed { top: calc(var(--top) + 12px); right: calc(var(--gutter-r) + 120px); }
@media (max-width: 520px) {
  .item { font-size: 26px; }
  .ed-help { display: none; }
  .ed-info { top: calc(var(--top) + 112px); left: var(--gutter-l); right: auto; font-size: 12px; grid-template-columns: auto auto auto auto; padding: 6px 10px; }
  .tab { padding: 12px 8px 10px; font-size: 13px; letter-spacing: 0.1em; }
  .ed-name { width: 9em; }
  .tool { padding: 9px 10px; font-size: 14px; }
  .garage .info .card-note, .garage .stats { display: none; }
  .row .val .v { min-width: 4.6em; }
  .row .lab { font-size: 17px; }
  .tc-gas { width: 84px; height: 108px; }
}
@media (max-width: 820px) {
  .garage { display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; }
  .garage .info { gap: 4px; }
}

/* ---------- misc fixed elements ---------- */
.hud-pause-fixed { position: fixed; z-index: 8; top: calc(var(--top) + 172px); right: var(--gutter-r); width: 44px; height: 44px; border: 1px solid var(--line-strong); background: rgba(9, 10, 12, 0.55); color: var(--text); display: grid; place-items: center; cursor: pointer; padding: 0; }
.hud-pause-fixed svg { width: 16px; height: 16px; }
.hud-pause-fixed[hidden] { display: none; }
@media (max-width: 820px) { .hud-pause-fixed { top: calc(var(--top) + 132px); } }
.fps { position: fixed; z-index: 9; top: calc(var(--top) + 6px); left: 50%; transform: translateX(-50%); font-family: var(--display); font-size: 13px; letter-spacing: 0.12em; color: var(--muted); pointer-events: none; }
.fps[hidden] { display: none; }
.boot-error { position: fixed; inset: auto var(--gutter-r) 40% var(--gutter-l); z-index: 70; font-family: var(--display); font-size: 20px; letter-spacing: 0.06em; text-align: center; color: var(--text); }
.boot-error[hidden] { display: none; }
</style>
